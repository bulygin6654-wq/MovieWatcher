name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieWatcher-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MovieWatcher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MovieWatcher.apk \
            --title "MovieWatcher (последняя сборка)" \
            --notes "Автоматическая сборка из ветки main. Скачайте MovieWatcher.apk и установите на телефон."
